<div class="card" data-card-id="card-02">
  <style>
    .card[data-card-id="card-02"] .root {
      position: relative; width: 100%; height: 100%;
      background: transparent;
      font-family: 'Inter', sans-serif;
    }
    .card[data-card-id="card-02"] .panel {
      position: absolute; left: 44px; right: 44px; top: 190px;
      background: rgba(12,10,13,.82);
      border: 2px solid rgba(244,242,236,.14);
      border-radius: 28px;
      padding: 40px 44px;
      backdrop-filter: blur(8px);
    }
    .card[data-card-id="card-02"] .kick {
      font-size: 21px; font-weight: 600; letter-spacing: .14em;
      color: var(--accent-1); margin-bottom: 20px;
    }
    .card[data-card-id="card-02"] .title {
      font-family: 'Unbounded', sans-serif; font-weight: 800;
      font-size: 104px; line-height: .98;
      color: var(--paper);
    }
    .card[data-card-id="card-02"] .title .accent { color: var(--accent-1); }
    .card[data-card-id="card-02"] .detail {
      font-size: 34px; font-weight: 400; color: var(--paper);
      opacity: .75; margin-top: 22px;
    }
    .card[data-card-id="card-02"] .earbox {
      position: absolute; right: 44px; top: 620px;
      width: 300px; height: 340px;
    }
    .card[data-card-id="card-02"] .budchip {
      position: absolute; left: 44px; top: 640px;
      display: inline-flex; align-items: center; gap: 14px;
      background: var(--accent-1); color: var(--paper);
      border-radius: 999px; padding: 16px 28px;
      font-size: 26px; font-weight: 600;
    }
    .card[data-card-id="card-02"] .dot {
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--paper);
    }
  </style>
  <div class="root">
    <div class="panel" id="c02-panel">
      <div class="kick" id="c02-kick" data-anim="fade-in" data-anim-at="0.2" data-anim-duration="0.4">ПОЧЕМУ НРАВЯТСЯ</div>
      <h1 class="title" id="c02-title" data-anim="mask-reveal" data-anim-at="0.35" data-anim-duration="0.7" data-anim-direction="left">ОТКРЫТОГО<br/><span class="accent">ТИПА</span></h1>
      <div class="detail" id="c02-detail" data-anim="fade-in" data-anim-at="1.0" data-anim-duration="0.5">лежит в ухе — без вакуума</div>
    </div>
    <svg class="earbox" id="c02-ear" viewBox="0 0 300 340" fill="none">
      <path id="c02-earpath" d="M 90 40 C 30 60 20 140 50 200 C 75 250 130 290 190 270 C 240 255 265 200 250 150 C 240 110 200 70 150 60" stroke="var(--paper)" stroke-width="6" stroke-linecap="round" opacity=".9" data-anim="draw-path" data-anim-at="0.8" data-anim-duration="1.1"/>
      <circle id="c02-bud" cx="150" cy="170" r="34" fill="var(--accent-1)" data-anim="scale-pop" data-anim-at="1.7" data-anim-duration="0.5"/>
      <circle cx="150" cy="170" r="34" fill="none" stroke="var(--paper)" stroke-width="3" opacity=".5" data-anim="fade-in" data-anim-at="1.7" data-anim-duration="0.5"/>
    </svg>
    <div class="budchip" id="c02-chip" data-anim="slide-in" data-anim-at="1.5" data-anim-duration="0.5" data-anim-from="left" data-anim-distance="120"><span class="dot"></span>открытый тип</div>
  </div>
</div>
