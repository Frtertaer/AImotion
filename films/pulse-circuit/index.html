<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a100e}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { clamp, lerp, spring, FEEL, rng } from '../../lib/motion.js';
import { T, DUR, BPM, BEAT, E8 } from './timeline.js';

const params=new URLSearchParams(location.search);
const fmt=params.get('fmt')||'16x9';
const SIZES={'16x9':[1920,1080],'9x16':[1080,1920],'1x1':[1080,1080]};
const [W,H]=SIZES[fmt]||SIZES['16x9'];
const PORTRAIT=H>W;
const P=Math.round(Math.min(W,H)/27);
const fps=Math.max(1,Math.min(120,Number(params.get('fps'))||24));

const canvas=document.getElementById('c');
canvas.width=W;canvas.height=H;
const ctx=canvas.getContext('2d');
window.FILM={w:W,h:H,dur:DUR};

const C={
  bg:'#08100d',grid:'#17221d',grid2:'#213029',dim:'#34423a',
  line:'#4c5b50',paper:'#f3f0d8',amber:'#f0ae32',hot:'#ffd36b',
  red:'#ff7050',green:'#8dd1a5',ink:'#0b130f'
};

const R=rng(417);
const grain=Array.from({length:900},()=>({
  x:R(),y:R(),a:.025+R()*.075,s:.35+R()*1.8
}));
const dust=Array.from({length:74},()=>({
  x:R(),y:R(),r:.45+R()*1.8,a:.08+R()*.24,p:R()*Math.PI*2
}));

const ease=x=>{
  x=clamp(x,0,1);
  return x*x*(3-2*x);
};
const beatPulse=(t,phase=0)=>{
  const q=((t/BEAT+phase)%1+1)%1;
  return Math.pow(Math.max(0,1-q),3);
};
const beatIndex=t=>Math.floor(Math.max(0,t)/BEAT);
const beatGate=t=>Math.abs(Math.sin(Math.PI*t/BEAT))>.985;

function txt(s,x,y,size,color=C.paper,align='left',alpha=1,weight=600){
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.fillStyle=color;
  ctx.font=`${weight} ${size}px Arial,Helvetica,sans-serif`;
  ctx.textAlign=align;
  ctx.textBaseline='middle';
  ctx.fillText(s,x,y);
  ctx.restore();
}
function label(s,x,y,color=C.dim,size=P*.52,align='left',a=.95){
  txt(s,x,y,size,color,align,a,600);
}
function line(x1,y1,x2,y2,color=C.line,w=1,a=1){
  ctx.save();
  ctx.globalAlpha=a;
  ctx.strokeStyle=color;
  ctx.lineWidth=w;
  ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.restore();
}
function rect(x,y,w,h,fill,stroke=null,lw=1,a=1){
  ctx.save();ctx.globalAlpha=a;
  if(fill&&fill!=='transparent'){ctx.fillStyle=fill;ctx.fillRect(x,y,w,h)}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.strokeRect(x,y,w,h)}
  ctx.restore();
}
function circle(x,y,r,color,a=1){
  ctx.save();ctx.globalAlpha=a;ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(x,y,Math.max(.1,r),0,Math.PI*2);ctx.fill();ctx.restore();
}
function path(points,color,w=1,a=1,dash=[]){
  ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=color;ctx.lineWidth=w;
  ctx.lineJoin='round';ctx.lineCap='round';ctx.setLineDash(dash);
  ctx.beginPath();
  points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
  ctx.stroke();ctx.restore();
}
function pulseMark(x,y,dx,dy,r,color,a=1,stretch=1.8){
  const ang=Math.atan2(dy,dx);
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  ctx.strokeStyle=color;ctx.globalAlpha=a*.72;ctx.lineWidth=r*.72;
  ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-r*4.5,0);ctx.lineTo(r*.5,0);ctx.stroke();
  ctx.restore();
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.scale(stretch,.72);
  circle(0,0,r,color,a*.52);circle(0,0,r*.54,C.paper,a);
  ctx.restore();
  circle(x,y,r*1.5,C.amber,a*.16);
}

const titleLayer=document.createElement('canvas');
titleLayer.width=W;titleLayer.height=H;
const titleCtx=titleLayer.getContext('2d');

function signalWord(word,x,y,size,color,phase,alpha=1){
  titleCtx.clearRect(0,0,W,H);
  titleCtx.save();
  titleCtx.globalAlpha=alpha;
  titleCtx.fillStyle=color;
  titleCtx.font=`760 ${size}px Arial,Helvetica,sans-serif`;
  titleCtx.textBaseline='middle';
  titleCtx.fillText(word,x,y);
  titleCtx.globalCompositeOperation='source-atop';
  titleCtx.strokeStyle=C.hot;
  titleCtx.lineWidth=Math.max(2,P*.045);
  titleCtx.globalAlpha=.8;
  titleCtx.beginPath();
  for(let i=-30;i<word.length*size/2+40;i+=4){
    const xx=x+i;
    const yy=y+Math.sin(i*.045+phase)*size*.12;
    i===-30?titleCtx.moveTo(xx,yy):titleCtx.lineTo(xx,yy);
  }
  titleCtx.stroke();
  titleCtx.restore();
  ctx.drawImage(titleLayer,0,0);
}

function render(t){
  t=clamp(Number(t)||0,0,DUR);
  const b=beatPulse(t);
  const b2=beatPulse(t,.18);
  const beatFlash=beatGate(t)?1:0;
  const intro=ease(t/1.2);
  const acquire=ease((t-2.0)/2.4);
  const phaseIn=ease((t-4.1)/1.7);
  const splitIn=ease((t-11.7)/1.5);
  const crossIn=ease((t-15.7)/1.25);
  const recombine=ease((t-21.8)/1.6);
  const sleep=ease((t-27)/3);
  const closing=ease((t-27.2)/2.4);

  ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);

  const margin=P*1.25;
  const x0=margin,x1=W-margin,cx=W*.5;
  const cy=PORTRAIT?H*.42:H*.44;
  const railL=x0,railR=x1;
  const titleY=PORTRAIT?H*.16:cy-P*5.25;
  const meterY=PORTRAIT?titleY+P*2.05:cy-P*3.35;
  const rulerY=PORTRAIT?H-P*4.0:cy+P*6.8;

  // Scope-like horizon grid: no frame, only a spatial field.
  for(let i=-4;i<=4;i++){
    const yy=cy+i*P*1.58;
    line(x0,yy,x1,yy,i===0?C.grid2:C.grid,1,i===0?.8:.48);
  }
  for(let i=0;i<=24;i++){
    const xx=lerp(x0,x1,i/24);
    line(xx,cy-P*6.25,xx,cy+P*6.25,C.grid,1,i%4===0?.3:.14);
  }

  // Deterministic atmosphere.
  for(const d of dust){
    const drift=Math.sin(t*.45+d.p)*P*.18;
    const focus=clamp(t/6,0,1)*.2;
    const px=lerp(d.x*W,lerp(d.x*W,cx,focus),.35)+drift;
    const py=lerp(d.y*H,cy,focus);
    circle(px,py,d.r,C.dim,d.a*(.6+.4*Math.sin(t*1.5+d.p)));
  }

  // Title lockup: signal visibly runs through the letterforms.
  signalWord('PULSE',x0,titleY,P*1.6,C.paper,t*2.1,1);
  const pulseWidth=P*5.95;
  signalWord('/ CIRCUIT',x0+pulseWidth,titleY,P*.75,C.amber,t*2.1+.8,.98);
  line(x0,titleY+P*1.05,x0+P*5.0,titleY+P*1.05,C.amber,P*.035,.62);
  label('SIGNAL STUDY  /  01',x0,titleY+P*.88,C.dim,P*.52);

  // Beat-locked amplitude counter.
  const amp=.18+.72*Math.abs(Math.sin(t*2.1))+.12*b;
  const meterW=P*7.2;
  for(let i=0;i<18;i++){
    const h=P*(.13+(.22+.78*Math.abs(Math.sin(i*.72+t*3.2)))*.43*amp);
    const tick=beatFlash&&i%3===0?1.25:1;
    rect(x0+i*meterW/18,meterY-h*.5,meterW/25,h,C.amber,null,1,
      (.25+.6*(.5+.5*Math.sin(t*2*Math.PI/BEAT)**2))*tick);
  }
  label('AMP',x0+meterW+P*.45,meterY,C.dim,P*.52);
  txt(`${Math.round(amp*99).toString().padStart(2,'0')}`,
    x0+meterW+P*1.55,meterY,P*.62,C.paper,'left',.98,700);

  // Rail: dormant breathing, then acquired charge, then exhalation.
  const breath=.5+.5*Math.sin(t*1.7);
  const railAlpha=.16+.42*intro+.35*acquire-.32*sleep;
  const railW=P*(.065+.035*acquire+.025*breath);
  line(railL,cy,railR,cy,C.line,railW,railAlpha);
  line(railL,cy,railR,cy,C.amber,railW*.48,.18+.42*acquire+.22*recombine);

  for(let i=0;i<=32;i++){
    const xx=lerp(railL,railR,i/32);
    const major=i%8===0;
    const nr=major?P*.105:P*.052;
    circle(xx,cy,nr,C.dim,railAlpha);
    if(b>.02)circle(xx,cy,nr+P*.1*b,C.amber,b*.16);
  }
  circle(railL,cy,P*(.18+.08*(1-sleep)),C.paper,.45+.4*(1-sleep));
  circle(railR,cy,P*(.18+.08*sleep),C.amber,.25+.5*sleep);
  label('IN',railL,cy+P*.72,C.dim,P*.5,'center');
  label('OUT',railR,cy+P*.72,C.dim,P*.5,'center');

  // Phase chamber.
  const chamberW=Math.min(W*.30,P*9.5),chamberH=P*2.35;
  const chamberX=cx-chamberW*.5,chamberY=cy-chamberH*.5;
  const chamberActive=clamp(phaseIn*(1-ease((t-10.2)/1.2)),0,1);
  rect(chamberX,chamberY,chamberW,chamberH,'transparent',C.amber,P*.045,
    .18+.65*chamberActive);
  for(let i=0;i<7;i++){
    const xx=chamberX+chamberW*(i+1)/8+
      Math.sin(t*2*Math.PI/BEAT+i)*P*.16;
    line(xx,chamberY+P*.2,xx,chamberY+chamberH-P*.2,
      C.amber,P*.035,.22+.58*chamberActive);
  }
  label('PHASE',cx,chamberY-P*.58,C.amber,P*.46,'center');

  // Signal acquisition: breathing packet becomes a charged rail.
  const railEnd=lerp(railL+P*.8,cx-chamberW*.55,ease((t-1.1)/10.8));
  if(t>=1.1&&t<12.2){
    for(let i=13;i>=1;i--){
      const wx=railEnd-i*P*.23;
      if(wx>railL&&wx<cx){
        const age=i/13;
        circle(wx,cy,P*(.06+.04*(1-age)),i<4?C.hot:C.amber,
          (.12+.5*(1-age))*(1-ease((t-10.8)/1.4)));
      }
    }
    const r=P*(.17+.08*b+.05*b2);
    ctx.save();ctx.translate(railEnd,cy);
    ctx.scale(1+.42*Math.abs(Math.sin(t*3)),1-.08*Math.abs(Math.sin(t*3)));
    circle(0,0,r,C.hot,.5);circle(0,0,r*.56,C.paper,1);
    ctx.restore();
    line(railEnd-P*.85,cy,railEnd+P*.28,cy,C.hot,P*.16,.92);
    circle(railEnd,cy,r+P*.18*b2,C.amber,b2*.3);
  }

  // Echo ghosts: phase-shifted copies trail the primary packet.
  if(t>=4.1&&t<12.2){
    for(let i=3;i>=0;i--){
      const delay=i*BEAT*.16;
      const age=t-(4.3+delay);
      if(age>=0&&age<2.25){
        const q=clamp(age/2.25,0,1);
        const ex=lerp(railL+P, chamberX+chamberW*.5,q);
        const ey=cy+Math.sin(age*7+i)*P*.14;
        const a=(1-q)*chamberActive*(i===0?1:.35);
        circle(ex,ey,P*(.18-i*.018),i===0?C.hot:C.amber,a);
        line(ex-P*.7,ey,ex+P*.7,ey,C.hot,P*.11,a*.7);
      }
    }
  }

  const split={x:chamberX+chamberW*.5+P*1.15,y:cy};
  const upper={x:split.x+P*3.0,y:cy-P*2.55};
  const lower={x:split.x+P*3.0,y:cy+P*2.55};
  const cross={x:Math.min(W-P*4.8,cx+chamberW*.5+P*5.1),y:cy};
  const join={x:cross.x+P*1.45,y:cy};
  const upperPath=[split,upper,{x:cross.x,y:upper.y},join];
  const lowerPath=[split,lower,{x:cross.x,y:lower.y},join];

  // Two channels have deliberately different physical texture.
  path(upperPath,C.amber,P*.075,.48+.44*splitIn,[P*.28,P*.18]);
  path(upperPath,C.paper,P*.022,.38+.3*splitIn,[P*.08,P*.13]);
  path(lowerPath,C.amber,P*.19,.4+.48*splitIn);
  path(lowerPath,C.red,P*.045,.42+.34*splitIn);
  for(let i=0;i<7;i++){
    const q=(i+.5)/7;
    const xx=lerp(split.x,lower.x,q);
    if(splitIn>.05)circle(xx,lerp(split.y,lower.y,q),P*.055,C.red,.35*splitIn);
  }

  // Split node and distinct signal packets.
  circle(split.x,split.y,P*(.13+.1*b),C.hot,.7+.3*splitIn);
  if(t>=12.1&&t<16.2){
    const q=ease((t-12.1)/4);
    pulseMark(lerp(split.x,upper.x,q),lerp(split.y,upper.y,q),
      upper.x-split.x,upper.y-split.y,P*(.18+.06*b2),C.hot,.92,1.8);
    pulseMark(lerp(split.x,lower.x,q*.86),lerp(split.y,lower.y,q*.86),
      lower.x-split.x,lower.y-split.y,P*(.25+.04*b),C.red,.7,1.1);
  }

  // Orthographic crossing panel.
  const panelSpring=clamp(spring(t-15.8,...FEEL.base),0,1);
  const panelFade=1-clamp((t-22)/1.1,0,1);
  const panelReveal=panelSpring*panelFade;
  const panelW=Math.min(W*.58,P*14),panelH=PORTRAIT?P*6:P*4.9;
  const panelX=cx-panelW*.5,panelBaseY=cy+P*2.05;
  const panelY=panelBaseY+P*3.4*(1-panelReveal);

  if(panelReveal>.01){
    rect(panelX,panelY,panelW,panelH,'#0c1510',C.amber,P*.055,.94*panelReveal);
    label('EVENT  /  IMPOSSIBLE CROSSING',panelX+P*.35,panelY+P*.48,
      C.amber,P*.52);
    label('ORTHOGRAPHIC Z VIEW',panelX+panelW-P*.35,panelY+P*1.02,
      C.dim,P*.46,'right');

    const left=panelX+P*.65,right=panelX+panelW-P*.65;
    const aY=panelY+P*2.05,bY=panelY+P*3.42;
    line(left,aY,right,aY,C.paper,P*.18,.98*panelReveal);
    line(left,aY+P*.12,right,aY+P*.12,C.hot,P*.035,.8*panelReveal);
    line(left,bY,right,bY,C.amber,P*.18,.95*panelReveal);
    line(left,bY+P*.12,right,bY+P*.12,C.red,P*.035,.7*panelReveal);
    line(panelX+panelW*.5,aY+P*.2,panelX+panelW*.5,bY-P*.2,
      C.green,P*.055,.9*panelReveal);
    circle(panelX+panelW*.5,aY,P*(.11+.04*beatFlash),C.hot,.95*panelReveal);
    circle(panelX+panelW*.5,bY,P*(.11+.04*beatFlash),C.amber,.85*panelReveal);
    label('VISIBLE DEPTH GAP',right,(aY+bY)*.5,C.green,P*.45,'right');
    label('A / OVER',left,panelY+panelH-P*.42,C.paper,P*.54);
    label('B / UNDER',right,panelY+panelH-P*.42,C.amber,P*.54,'right');

    // Panel readout ticks are locked to the same beat grid.
    for(let i=0;i<9;i++){
      const xx=left+(right-left)*i/8;
      line(xx,panelY+P*1.35,xx,panelY+P*(1.35+(i%4===0?.16:.08)),
        C.green,1,.45+.35*beatFlash);
    }
  }

  // The crossing: slash transmits from PULSE to CIRCUIT.
  if(t>=16.1){
    const q=clamp((t-16.1)/4.9,0,1);
    const gap=P*(.42+.23*(.5+.5*Math.sin(2*Math.PI*t/BEAT)));
    line(cross.x-P*1.08,cross.y,cross.x-gap,cross.y,C.amber,P*.17,.9*q);
    line(cross.x+gap,cross.y,cross.x+P*1.08,cross.y,C.amber,P*.17,.9*q);
    ctx.save();
    ctx.globalAlpha=.32+.62*q;ctx.strokeStyle=C.paper;ctx.lineWidth=P*.14;
    ctx.beginPath();ctx.moveTo(cross.x-P*1.08,cross.y);
    ctx.quadraticCurveTo(cross.x,cross.y-P*.9,cross.x+P*1.08,cross.y);
    ctx.stroke();ctx.restore();
    circle(cross.x,cross.y,P*(.14+.08*b),C.hot,q);
    if(q>.05){
      const slashX=lerp(x0+P*5.7,x0+P*6.65,q);
      line(slashX,titleY-P*.48,slashX+P*.55,titleY+P*.48,
        C.hot,P*.055,.25+.7*q);
    }
  }
  label('SPLIT',split.x,split.y-P*.85,C.amber,P*.52,'center');
  label('X / Z',cross.x,cross.y-P*1.02,C.paper,P*.48,'center');

  // Recombined double-band signal.
  if(t>=16.1&&t<26.8){
    const q=clamp((t-16.1)/6.3,0,1);
    const px=lerp(upper.x,join.x,q),py=lerp(upper.y,join.y,q);
    pulseMark(px,py,join.x-upper.x,join.y-upper.y,P*(.18+.07*b),
      C.hot,.92,1.85);
  }
  if(t>=21.8&&t<28){
    const q=ease((t-21.8)/3.2);
    const px=lerp(join.x,lerp(join.x,railR,q),q);
    line(px,cy-P*.13,px+P*.75,cy-P*.13,C.paper,P*.07,.5*q);
    line(px,cy+P*.13,px+P*.75,cy+P*.13,C.amber,P*.07,.62*q);
    circle(px,cy,P*(.22+.08*b),C.hot,.8*q);
    circle(px,cy,P*.09,C.paper,q);
  }

  // Beat-local accent at the current state position.
  const accentX=t<12?railEnd:t<16?split.x:t<22?cross.x:lerp(join.x,railR,recombine);
  if(b>.04&&t>1){
    circle(accentX,cy,P*(.25+b*.24),C.amber,b*.18);
    circle(accentX,cy,P*(.46+b*.25),C.hot,b*.045);
  }

  // Timeline ruler.
  line(x0,rulerY,x1,rulerY,C.dim,1,.8);
  for(let i=0;i<=16;i++){
    const xx=x0+(x1-x0)*i/16,major=i%4===0;
    line(xx,rulerY,xx,rulerY+(major?P*.34:P*.16),C.line,1,.9);
    if(major)label(`${Math.round(DUR*i/16)}s`,xx,rulerY+P*.58,C.dim,P*.48,'center');
  }
  const elapsed=(t/DUR)*(x1-x0);
  line(x0+elapsed,rulerY-P*.18,x0+elapsed,rulerY+P*.28,C.amber,2,.98);
  label(`TIME ${t.toFixed(2)}s`,x1,rulerY+P*.58,C.amber,P*.48,'right');

  const cardY=PORTRAIT?rulerY+P*1.35:cy+P*8.25;
  const events=[
    [0,'ARM / IDLE'],[2,'SIGNAL ACQUIRED'],[5,'PHASE CHAMBER'],
    [9,'DELAY / ECHO'],[12,'SPLIT EVENT'],[16,'DEPTH CONFLICT'],
    [19,'OVERPASS PROVED'],[23,'RECOMBINE'],[27,'SYSTEM SLEEP']
  ];
  let ev=events[0];for(const e of events)if(t>=e[0])ev=e;
  label(`EVENT  ${ev[1]}`,x0,cardY,C.amber,P*.62);
  label(`FRAME ${String(Math.floor(t*fps)%10000).padStart(4,'0')}  /  ${fps} FPS`,
    x1,cardY,C.dim,P*.5,'right');

  // Bookend statement, subordinated to the signal.
  const book=Math.max(1-ease(t/2.2),closing);
  if(book>.01){
    txt('ONE SIGNAL.',cx,cy-P*2.25,P*1.05,C.paper,'center',book,700);
    txt('TWO DEPTHS.',cx,cy-P*1.12,P*.72,C.amber,'center',book,650);
  }

  // Sleep: rail exhales into the grid.
  if(t>27){
    const k=ease((t-27)/3);
    circle(railL,cy,P*(.22+k*.3),C.paper,(1-k)*.38);
    circle(railR,cy,P*(.22+k*.3),C.amber,(1-k)*.34);
  }

  // Exhibition finish: restrained scanlines, vignette, deterministic grain.
  ctx.save();
  ctx.globalAlpha=.045;
  ctx.fillStyle=C.paper;
  for(let y=0;y<H;y+=4)ctx.fillRect(0,y,W,1);
  ctx.restore();

  for(const g of grain){
    const tw=.55+.45*Math.sin(t*1.9+g.x*17);
    circle(g.x*W,g.y*H,g.s,C.paper,g.a*tw);
  }

  const vg=ctx.createRadialGradient(W*.5,H*.45,Math.min(W,H)*.18,
    W*.5,H*.45,Math.max(W,H)*.72);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(.72,'rgba(0,0,0,.08)');
  vg.addColorStop(1,'rgba(0,0,0,.42)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}

window.seek=t=>{render(t);return true};
window.READY=true;
</script>
</body>
</html>
